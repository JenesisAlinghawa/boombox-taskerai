<!DOCTYPE html>
<html>
<head>
  <title>Clear Session</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    h1 {
      color: #333;
      margin-top: 0;
    }
    p {
      color: #666;
      margin: 20px 0;
    }
    .status {
      margin: 20px 0;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 5px;
      font-family: monospace;
      color: #333;
    }
    .success {
      color: #27ae60;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔄 Clearing Session</h1>
    <p>Removing stale localStorage data...</p>
    <div class="status" id="status">Processing...</div>
  </div>

  <script>
    try {
      // Clear all storage
      localStorage.clear();
      sessionStorage.clear();
      
      // Clear cookies
      document.cookie.split(";").forEach(c => {
        const eqPos = c.indexOf("=");
        const name = eqPos > -1 ? c.substr(0, eqPos).trim() : c.trim();
        if (name) {
          document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;domain=' + window.location.hostname;
          document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;';
        }
      });

      // Update status
      const statusDiv = document.getElementById('status');
      statusDiv.innerHTML = '<span class="success">✅ Session cleared successfully!</span>';
      statusDiv.innerHTML += '<p>Redirecting to home page...</p>';

      // Redirect after 2 seconds
      setTimeout(() => {
        window.location.href = '/';
      }, 2000);
    } catch (err) {
      const statusDiv = document.getElementById('status');
      statusDiv.innerHTML = '<span style="color: #e74c3c;">❌ Error: ' + err.message + '</span>';
    }
  </script>
</body>
</html>
